[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "minitype"
version = "0.1.0"
description = "A vibecoded CLI typing game in Python, inspired by keybr and Monkeytype"
readme = "README.md"
requires-python = ">=3.8"

[project.scripts]
minitype = "minitype.app:main"

[tool.setuptools.packages.find]
include = ["minitype*"]
