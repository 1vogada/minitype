# The browser version (web/) on GitHub Pages: on every push to web-port the
# tests run, web/ is built, and the build replaces the gh-pages branch's
# contents (Pages serves gh-pages /). No third-party actions.
name: web pages

on:
  push:
    branches: [web-port]
    paths: ["web/**", ".github/workflows/web-pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publish dist to gh-pages
        # a new commit on top of gh-pages with the build as its whole contents (no force push)
        run: |
          git clone -q --depth 1 --branch gh-pages "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ../pages
          find ../pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r dist/. ../pages/
          touch ../pages/.nojekyll
          cd ../pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -qm "Pages: web/ from ${GITHUB_SHA::7}"
          git push -q origin gh-pages
